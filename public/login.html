<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · mix n match</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="/"><img class="logo-mark" src="/favicon.svg" alt="">mix n match</a>
      <nav class="nav"></nav>
    </div>
  </header>

  <main>
    <!-- Step A: ask for an email -->
    <section class="card center-card stack" id="ask">
      <h2>Sign in</h2>
      <p class="muted">Type your email and we'll send you a one-click sign-in link. No password needed.</p>
      <form id="email-form" class="stack">
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <button class="btn btn-primary" type="submit" id="send">Email me a link</button>
      </form>
      <div id="sent" class="notice ok hidden" role="status"></div>
      <div id="dev-link" class="notice warn hidden"></div>
    </section>

    <!-- Step B: user opened the link from the email -->
    <section class="card center-card stack hidden" id="confirm">
      <h2>Welcome back</h2>
      <p class="muted">Click below to finish signing in.</p>
      <button class="btn btn-primary" id="confirm-btn">Sign in to mix n match</button>
    </section>

    <div id="error" class="notice bad center-card hidden" role="alert"></div>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <span>mix n match</span>
      <span class="row"><a href="/privacy">Privacy</a><a href="/terms">Terms</a></span>
    </div>
  </footer>
</body>
</html>
