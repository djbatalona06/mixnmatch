<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Back up · mix n match</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/export.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="/"><img class="logo-mark" src="/favicon.svg" alt="">mix n match</a>
      <nav class="nav"></nav>
    </div>
  </header>

  <main class="stack">
    <div>
      <h1>Back up your music</h1>
      <p class="muted">Save your playlists as a file on your computer. You can open it in a spreadsheet, keep it safe, or upload it later to move the songs to any app.</p>
    </div>

    <div class="card stack">
      <div>
        <label for="platform">From which app?</label>
        <select id="platform"></select>
      </div>
      <div>
        <label for="format">File type</label>
        <select id="format">
          <option value="jspf">JSPF (best for moving back in later)</option>
          <option value="csv">CSV (opens in Excel / Google Sheets)</option>
        </select>
      </div>
    </div>

    <div class="row space">
      <h2>Pick playlists</h2>
      <button class="btn btn-small" id="select-all">Select all</button>
    </div>
    <p class="muted" id="pick-status"></p>
    <div class="grid-tight" id="playlist-grid"></div>
    <div><button class="btn hidden" id="load-more">Load more playlists</button></div>

    <div id="progress" class="notice hidden" role="status"></div>
    <div class="row"><button class="btn btn-primary btn-big" id="download" disabled>Download backup</button></div>
  </main>

  <footer class="site-footer">
    <div class="inner">
      <span>mix n match</span>
      <span class="row"><a href="/privacy">Privacy</a><a href="/terms">Terms</a></span>
    </div>
  </footer>
</body>
</html>
